---
- set_fact:
    suricata_sensor_config: /opt/suricata/config
    suricata_sensor_rules: /opt/suricata/rules

- name: Create mandatory capture mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: 999
    group: 999
    recurse: yes
    mode: '0755'
  loop:
  - "{{ suricata_sensor_config }}"
  - "{{ suricata_sensor_rules }}"
  - "{{ suricata_sensor_logs }}"

- name: Ensure placeholder threshold file
  ansible.builtin.copy:
    content: ""
    dest: "{{ suricata_sensor_rules }}/threshold.config"
    force: false
    owner: 999
    group: 999
    mode: '0644'

- name: Deploy suricata config
  ansible.builtin.copy:
    content: "%YAML 1.1\n---\n{{ suricata_yaml | to_nice_yaml }}"
    dest: "{{ suricata_sensor_config }}/suricata.yaml"
  notify:
  - restart suricata capture
  register: suricata_config_updated

- name: Validate suricata config and rules
  ansible.builtin.command:
    cmd: >-
      docker run --rm
      -v {{ suricata_sensor_config }}/suricata.yaml:/etc/suricata/suricata.yaml:ro
      -v {{ suricata_sensor_rules }}:/rules:rw
      {{ suricata_image }}:{{ suricata_tag }}
      suricata -T -c /etc/suricata/suricata.yaml -l /tmp
  changed_when: false

- name: Deploy suricata live capture mode
  community.docker.docker_container:
    name: "suricata"
    image: "{{ suricata_image }}:{{ suricata_tag }}"
    pull: true
    network_mode: host
    state: started
    restart_policy: unless-stopped
    volumes:
    - "{{ suricata_sensor_logs }}:/var/log/suricata:rw"
    - "{{ suricata_sensor_config }}/suricata.yaml:/etc/suricata/suricata.yaml:ro"
    - "{{ suricata_sensor_rules }}:/rules:rw"
    capabilities:
      - net_admin
      - sys_nice
    command: suricata -c /etc/suricata/suricata.yaml --af-packet -vv -k none
  register: suricata_capture_updated

- name: Reload suricata ruleset after a suricata-update change
  ansible.builtin.command:
    cmd: "docker exec suricata suricatasc -c 'ruleset-reload-rules'"
  when:
    - suricata_update_ruleset_changed | default(false) | bool
    - not (suricata_config_updated.changed | bool)
  changed_when: true
